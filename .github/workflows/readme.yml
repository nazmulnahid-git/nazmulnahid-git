name: Redraw README

on:
  schedule:
    - cron: '30 18 * * *' # 00:30 in Dhaka
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/readme.yml]

permissions:
  contents: write

concurrency:
  group: readme
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Draw panels
        run: node scripts/build.mjs
        env:
          # Optional: a personal token (read:user) in a STATS_TOKEN secret counts private contributions too.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git diff --cached --quiet || git commit -m "Redraw README stats" && git push
